name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    outputs:
      pypi-version-exists: ${{ steps.pypi-version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python -c "import tomllib,sys; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PROJ"
            exit 1
          fi
          echo "Tag and pyproject version match: $PROJ"

      - name: Check whether version already exists on PyPI
        id: pypi-version
        run: |
          export TAG="${GITHUB_REF_NAME#v}"
          EXISTS=$(python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ["TAG"]
          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/rkn-block-checker/json",
                  timeout=10,
              ) as response:
                  data = json.load(response)
          except (OSError, urllib.error.URLError, json.JSONDecodeError):
              print("false")
          else:
              print(str(version in data.get("releases", {})).lower())
          PY
          )
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" = "true" ]; then
            echo "Version $TAG already exists on PyPI; PyPI publish job will be skipped."
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew :android:app:assembleDebug

      - name: Prepare release APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/rkn-block-checker-android-${GITHUB_REF_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.pypi-version-exists != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rkn-block-checker
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            android-apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
